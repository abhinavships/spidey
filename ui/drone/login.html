<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — SkyLoop Flight Academy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚁</text></svg>">
<link rel="stylesheet" href="/drone-static/skyloop.css">
<style>
body{display:grid;place-items:center;min-height:100vh}
.box{width:min(410px,92vw);background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:30px}
.box .brand{font-size:19px;margin-bottom:5px}
.box p.sub{margin-bottom:22px}
.accounts{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.accounts code{color:var(--ink)}
.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);
  color:#fecaca;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:16px}
</style></head><body>
<div class="box">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round">
      <circle cx="5" cy="5" r="3"/><circle cx="19" cy="5" r="3"/>
      <circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/>
      <path d="M7.2 7.2 10 10m4 4 2.8 2.8M16.8 7.2 14 10m-4 4-2.8 2.8"/>
      <rect x="9.5" y="9.5" width="5" height="5" rx="1.3"/>
    </svg>
    SkyLoop Flight Academy
  </div>
  <p class="sub">Drone pilot training &amp; fleet operations</p>
  <div class="err" data-testid="login-error" hidden>That email and password don't match an account.</div>
  <form method="post" action="/drone/login">
    <div class="field"><label for="email">Work email</label>
      <input id="email" name="email" type="email" data-testid="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" data-testid="password" autocomplete="current-password" required></div>
    <button type="submit" data-testid="sign-in" style="width:100%">Sign in</button>
  </form>
  <div class="accounts">
    Demo accounts — password <code>flightdemo</code><br>
    <code>vp@skyloop.io</code> · <code>tech@skyloop.io</code> · <code>mkt@skyloop.io</code>
  </div>
</div>
<script>
if(new URLSearchParams(location.search).has('error'))
  document.querySelector('[data-testid=login-error]').hidden=false;
</script>
</body></html>
